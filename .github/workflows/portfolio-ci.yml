name: Portfolio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Escanear secretos con Gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 2

  links:
    name: Enlaces internos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Comprobar enlaces relativos
        uses: lanuzalorenzo/core/actions/check-links@v1.1

  pkce-lab:
    name: Laboratorio PKCE (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-seguridad-azure/lab/pkce
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Preparar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 01-seguridad-azure/lab/pkce/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Verificar el módulo
        run: npm run test:token

      - name: Auditar dependencias
        run: npm audit --omit=dev --audit-level=high
