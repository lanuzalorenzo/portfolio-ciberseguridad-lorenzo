input {
  file {
    path => "/usr/share/logstash/sample-logs/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => plain {
      charset => "UTF-8"
    }
  }
}

filter {
  # Los eventos del laboratorio usan pares clave=valor separados por espacios.
  kv {
    source => "message"
    field_split => " "
    value_split => "="
    target => "parsed"
    trim_key => " "
    trim_value => " "
  }

  date {
    match => ["[parsed][ts]", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    rename => {
      "[parsed][host]" => "[host][name]"
      "[parsed][service]" => "[service][name]"
      "[parsed][user]" => "[user][name]"
      "[parsed][src_ip]" => "[source][ip]"
      "[parsed][action]" => "[event][action]"
      "[parsed][result]" => "[event][outcome]"
      "[parsed][reason]" => "[event][reason]"
      "[parsed][severity]" => "[event][severity]"
      "[parsed][method]" => "[http][request][method]"
      "[parsed][path]" => "[url][path]"
      "[parsed][status]" => "[http][response][status_code]"
      "[parsed][command]" => "[process][command_line]"
    }
  }

  if [http][response][status_code] {
    mutate {
      convert => {
        "[http][response][status_code]" => "integer"
      }
    }
  }

  mutate {
    add_field => {
      "[lab][name]" => "elk-security-lab"
      "[event][dataset]" => "security.synthetic"
    }
    remove_field => ["parsed", "message"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "lab-security-%{+YYYY.MM.dd}"
    ilm_enabled => false
    manage_template => false
  }

  stdout {
    codec => rubydebug
  }
}
