  <text class="modulos" x="184" y="453">07 DevSecOps y gobernanza: pipeline, SAST, SCA, contenedor e IaC</text>
  <path class="edge" d="M408 484V504" marker-end="url(#flecha)"/>
  <rect class="capa" x="112" y="504" width="592" height="84" rx="12"/>
  <rect class="chip" x="130" y="529" width="34" height="34" rx="9"/>
  <text class="chip-num" x="147" y="546">1</text>
