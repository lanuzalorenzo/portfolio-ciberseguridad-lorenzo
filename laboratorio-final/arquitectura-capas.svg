<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Defensa en profundidad: capas y módulos del portfolio</title>
  <desc id="descripcion">Cinco capas, de detección y respuesta en la parte superior a arquitectura y AppSec en la base. Una banda transversal cubre la validación ofensiva y el forense.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .capa { fill: #0e2a47; stroke: #38bdf8; stroke-opacity: .55; stroke-width: 1.25; }
    .chip { fill: #07131e; stroke: #38bdf8; stroke-opacity: .55; stroke-width: 1.25; }
    .chip-num { fill: #f8fafc; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .titulo { fill: #f8fafc; font-size: 13px; font-weight: 600; dominant-baseline: central; }
    .modulos { fill: #a3b8c9; font-size: 10.5px; dominant-baseline: central; }
    .pill { fill: #0e2a47; stroke: #38bdf8; stroke-opacity: .45; stroke-width: 1.25; }
    .pill-text { fill: #f8fafc; font-size: 12px; text-anchor: middle; dominant-baseline: central; }
    .edge { stroke: #38bdf8; stroke-opacity: .6; stroke-width: 1.25; fill: none; }
    .banda { fill: none; stroke: #38bdf8; stroke-opacity: .45; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .banda-texto { fill: #a3b8c9; font-size: 10px; text-anchor: middle; dominant-baseline: central; letter-spacing: .4px; }
  </style>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#38bdf8" fill-opacity=".8"/>
    </marker>
  </defs>
    <rect width="720" height="600" rx="16" fill="#07131e"/>
  <rect x="290" y="8" width="236" height="40" rx="20" class="pill"/>
  <text class="pill-text" x="408" y="28">Tráfico externo / clientes</text>
  <path class="edge" d="M408 48V84" marker-end="url(#flecha)"/>
  <rect class="banda" x="52" y="88" width="42" height="500" rx="12"/>
  <text class="banda-texto" x="73" y="338" transform="rotate(-90 73 338)">Transversal · 11 Validación ofensiva · 12 Forense y respuesta</text>
  <rect class="capa" x="112" y="88" width="592" height="84" rx="12"/>
  <rect class="chip" x="130" y="113" width="34" height="34" rx="9"/>
  <text class="chip-num" x="147" y="130">5</text>
  <text class="titulo" x="184" y="119">Capa 5 · Detección, SOC y analítica</text>
  <text class="modulos" x="184" y="141">09 Microsoft Sentinel · 10 ELK Stack Security · 12 Forense cloud y respuesta</text>
  <path class="edge" d="M408 172V192" marker-end="url(#flecha)"/>
  <rect class="capa" x="112" y="192" width="592" height="84" rx="12"/>
  <rect class="chip" x="130" y="217" width="34" height="34" rx="9"/>
  <text class="chip-num" x="147" y="234">4</text>
  <text class="titulo" x="184" y="223">Capa 4 · Red y postura cloud</text>
  <text class="modulos" x="184" y="245">03 Cloud Audits · 04 Defender for Cloud · 05 Defender Suite · 08 Seguridad de red</text>
  <path class="edge" d="M408 276V296" marker-end="url(#flecha)"/>
  <rect class="capa" x="112" y="296" width="592" height="84" rx="12"/>
  <rect class="chip" x="130" y="321" width="34" height="34" rx="9"/>
