  <text class="modulos" x="184" y="349">01 OAuth 2.0, PKCE y JWT · 02 Identity Security · 06 Acceso privilegiado</text>
  <path class="edge" d="M408 380V400" marker-end="url(#flecha)"/>
  <rect class="capa" x="112" y="400" width="592" height="84" rx="12"/>
  <rect class="chip" x="130" y="425" width="34" height="34" rx="9"/>
